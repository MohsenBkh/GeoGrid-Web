# Nginx reverse proxy for GeoGrid Web.
# Install: sudo cp deploy/nginx.conf /etc/nginx/sites-available/geogrid-web
#          sudo ln -s /etc/nginx/sites-available/geogrid-web /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
# Then run certbot for HTTPS: sudo certbot --nginx -d yourdomain.com

server {
    listen 80;
    server_name yourdomain.com;

    client_max_body_size 110M;  # keep a bit above GEOGRID_MAX_UPLOAD_MB

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;  # conversions can take a while for large inputs
    }
}
